<app-header tipo="mae"></app-header>

<main class="ct-pagina">
  <!-- ===== BANNER ===== -->
  <section class="ct-banner">
    <img class="ct-banner-img" src="./img/Imagem-Consultorias.jpg" alt="" aria-hidden="true">
    <div class="ct-banner-texto">
      <h1>Um espaço seguro para você <span>ser ouvida</span></h1>
      <p>Psicólogas e advogadas voluntárias para te ouvir e orientar, de graça e direto pelo site.</p>
    </div>
  </section>

  <!-- ===== 3 BOTÕES ===== -->
  <section class="ct-botoes">
    <button type="button" class="ct-botao ct-botao-principal" (click)="agendar()">
      <span class="ct-botao-icone"><i class="fa-regular fa-calendar-plus"></i></span>
      <strong>Marcar consulta</strong>
      <small>Escolha a psicóloga ou advogada e o horário</small>
    </button>

    <button type="button" class="ct-botao" (click)="minhasConsultas()">
      <span class="ct-botao-icone">
        <i class="fa-regular fa-calendar-check"></i>
        @if (proximas() > 0) { <em>{{ proximas() }}</em> }
      </span>
      <strong>Minhas consultas</strong>
      <small>Veja seus horários e entre na chamada</small>
    </button>

    <button type="button" class="ct-botao" (click)="guia.abrir()">
      <span class="ct-botao-icone"><i class="fa-regular fa-lightbulb"></i></span>
      <strong>Como funciona</strong>
      <small>Entenda em 4 passos, bem rápido</small>
    </button>
  </section>

  <!-- ===== COMO FUNCIONA: o mesmo slide de passos da página inicial ===== -->
  <app-guia-passos #guia chave="consultas" [passos]="passosComoFunciona"></app-guia-passos>
</main>
