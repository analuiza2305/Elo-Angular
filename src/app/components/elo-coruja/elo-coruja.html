<svg [attr.viewBox]="soRosto ? '28 22 144 144' : '0 0 200 220'"
     [attr.class]="'elo exp-' + expressao + (animada ? ' animada' : '')" xmlns="http://www.w3.org/2000/svg">
  @if (soRosto) {
    <defs>
      <clipPath id="elo-recorte-rosto"><circle cx="100" cy="94" r="72" /></clipPath>
    </defs>
    <circle cx="100" cy="94" r="72" fill="#EFE8FD" />
  }

  <g [attr.clip-path]="soRosto ? 'url(#elo-recorte-rosto)' : null">
    @if (!soRosto) {
      <!-- sombra no chão -->
      <ellipse cx="100" cy="210" rx="50" ry="6" fill="#5B3D99" opacity=".14" />
      <!-- pezinhos -->
      <ellipse cx="84" cy="202" rx="11" ry="6" fill="#F5A04A" />
      <ellipse cx="116" cy="202" rx="11" ry="6" fill="#F5A04A" />
    }

    <!-- orelhas (tufos) -->
    <path d="M52 66 L42 20 L86 46 Z" fill="#5B3D99" />
    <path d="M148 66 L158 20 L114 46 Z" fill="#5B3D99" />

    <!-- asa esquerda -->
    @if (expressao !== 'acolhendo') {
      <ellipse cx="42" cy="146" rx="14" ry="36" transform="rotate(12 42 146)" fill="#6A4DC0" />
    }

    <!-- corpo -->
    <path d="M100 30 C 150 30, 166 74, 164 124 C 162 176, 136 200, 100 200 C 64 200, 38 176, 36 124 C 34 74, 50 30, 100 30 Z" fill="#7C5FCB" />
    <!-- barriga com peninhas -->
    <ellipse cx="100" cy="156" rx="42" ry="40" fill="#FFFFFF" />
    <path d="M80 150 q6 6 12 0 M98 150 q6 6 12 0 M116 150 q-3 6 -8 6 M86 168 q6 6 12 0 M104 168 q6 6 12 0 M92 184 q6 5 12 0"
          fill="none" stroke="#E3DAF6" stroke-width="3" stroke-linecap="round" />

    <!-- acolhendo: a asa esquerda abraça a barriga (como quem põe a mão no coração) -->
    @if (expressao === 'acolhendo') {
      <path d="M40 116 C 30 150, 52 176, 104 168 C 86 160, 70 144, 64 120 Z" fill="#6A4DC0" />
    }

    <!-- asa direita -->
    @if (expressao === 'oi') {
      <g class="asa-aceno">
        <ellipse cx="166" cy="104" rx="13" ry="34" transform="rotate(-38 166 104)" fill="#6A4DC0" />
      </g>
      <path class="tracos-aceno" d="M182 58 q8 4 6 12 M190 50 q10 6 8 16" fill="none" stroke="#9D8FE7" stroke-width="3" stroke-linecap="round" />
    } @else {
      <ellipse cx="158" cy="146" rx="14" ry="36" transform="rotate(-12 158 146)" fill="#6A4DC0" />
    }

    <!-- olhos -->
    @switch (expressao) {
      @case ('acolhendo') {
        <path d="M60 98 q16 -16 32 0" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" />
        <path d="M108 98 q16 -16 32 0" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" />
      }
      @case ('piscadinha') {
        <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
        <circle cx="79" cy="95" r="11" fill="#2A1B5C" />
        <circle cx="83" cy="90" r="4" fill="#FFFFFF" />
        <path class="olho-piscando" d="M108 96 q16 -12 32 0" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" />
      }
      @case ('pensando') {
        <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
        <circle cx="124" cy="92" r="21" fill="#FFFFFF" />
        <circle cx="82" cy="86" r="11" fill="#2A1B5C" />
        <circle cx="130" cy="86" r="11" fill="#2A1B5C" />
        <circle cx="86" cy="82" r="4" fill="#FFFFFF" />
        <circle cx="134" cy="82" r="4" fill="#FFFFFF" />
      }
      @default {
        <g class="olhos">
          <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="124" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="79" cy="95" r="11" fill="#2A1B5C" />
          <circle cx="121" cy="95" r="11" fill="#2A1B5C" />
          <circle cx="83" cy="90" r="4" fill="#FFFFFF" />
          <circle cx="125" cy="90" r="4" fill="#FFFFFF" />
        </g>
      }
    }

    <!-- bochechas e bico -->
    <ellipse cx="54" cy="116" rx="9" ry="6" fill="#F4A6C6" opacity=".9" />
    <ellipse cx="146" cy="116" rx="9" ry="6" fill="#F4A6C6" opacity=".9" />
    <path d="M93 110 L107 110 L100 120 Z" fill="#F5A04A" stroke="#F5A04A" stroke-width="2" stroke-linejoin="round" />

    <!-- cachecol rosa -->
    <path d="M58 126 C 80 136, 120 136, 142 126 L 142 138 C 120 148, 80 148, 58 138 Z" fill="#F28BB3" />
    <path d="M70 132 v10 M84 135 v10 M98 136 v10 M112 135 v10 M126 132 v10" stroke="#F7B3CD" stroke-width="2.5" stroke-linecap="round" />
    <path d="M120 140 L132 140 L136 170 L124 166 Z" fill="#E66F9C" />
    <path d="M110 140 L122 140 L116 162 L106 158 Z" fill="#F28BB3" />
  </g>

  <!-- extras de cada expressão -->
  @if (expressao === 'pensando' && !soRosto) {
    <g class="balao">
      <circle cx="160" cy="36" r="14" fill="#FFFFFF" stroke="#E3DAF6" stroke-width="2" />
      <text x="160" y="42" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="800" font-size="17" fill="#5B3D99">?</text>
    </g>
  }
  @if (expressao === 'acolhendo' && !soRosto) {
    <path class="coracao" d="M160 36 c-4 -8 -16 -6 -14 4 c1 6 8 10 14 14 c6 -4 13 -8 14 -14 c2 -10 -10 -12 -14 -4 z" fill="#F28BB3" />
  }
</svg>
