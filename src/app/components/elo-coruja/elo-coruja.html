<svg [attr.viewBox]="soRosto ? '28 22 144 144' : '0 0 200 220'"
     [attr.class]="'elo exp-' + exp() + (animada ? ' animada' : '') + (efeito() ? ' ef-' + efeito() : '')"
     xmlns="http://www.w3.org/2000/svg">
  @if (soRosto) {
    <defs>
      <clipPath id="elo-recorte-rosto"><circle cx="100" cy="94" r="72" /></clipPath>
    </defs>
    <circle cx="100" cy="94" r="72" fill="#EFE8FD" />
  }

  <!-- easter egg "modo noite": lua e estrelinhas atrás da Elô -->
  @if (efeito() === 'noite' && !soRosto) {
    <g class="noite">
      <path d="M30 18 a16 16 0 1 0 18 22 a12 12 0 1 1 -18 -22 z" fill="#F7D774" />
      <path class="estrela e1" d="M176 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#F7D774" />
      <path class="estrela e2" d="M18 96 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 z" fill="#C9B8F5" />
      <path class="estrela e3" d="M186 118 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 z" fill="#F7D774" />
      <path class="estrela e4" d="M60 8 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 z" fill="#C9B8F5" />
    </g>
  }

  <g class="corpo-todo" [attr.clip-path]="soRosto ? 'url(#elo-recorte-rosto)' : null">
    @if (!soRosto) {
      <!-- sombra no chão -->
      <ellipse class="sombra" cx="100" cy="210" rx="50" ry="6" fill="#5B3D99" opacity=".14" />
      <!-- pezinhos -->
      <g class="zona" (click)="tocar('pes', $event)">
        <ellipse cx="84" cy="202" rx="11" ry="6" fill="#F5A04A" />
        <ellipse cx="116" cy="202" rx="11" ry="6" fill="#F5A04A" />
      </g>
    }

    <!-- orelhas (tufos) -->
    <g class="zona" (click)="tocar('orelhas', $event)">
      <path class="orelha-esq" d="M52 66 L42 20 L86 46 Z" fill="#5B3D99" />
      <path class="orelha-dir" d="M148 66 L158 20 L114 46 Z" fill="#5B3D99" />
    </g>

    <!-- asa esquerda -->
    @if (exp() !== 'acolhendo') {
      <g class="asa-esq zona" (click)="tocar('asa', $event)">
        <ellipse cx="42" cy="146" rx="14" ry="36" transform="rotate(12 42 146)" fill="#6A4DC0" />
      </g>
    }

    <!-- corpo (tocar fora das outras partes = carinho na cabeça) -->
    <path class="zona" (click)="tocar('corpo', $event)" d="M100 30 C 150 30, 166 74, 164 124 C 162 176, 136 200, 100 200 C 64 200, 38 176, 36 124 C 34 74, 50 30, 100 30 Z" fill="#7C5FCB" />
    <!-- barriga com peninhas -->
    <g class="zona" (click)="tocar('barriga', $event)">
      <ellipse cx="100" cy="156" rx="42" ry="40" fill="#FFFFFF" />
      <path d="M80 150 q6 6 12 0 M98 150 q6 6 12 0 M116 150 q-3 6 -8 6 M86 168 q6 6 12 0 M104 168 q6 6 12 0 M92 184 q6 5 12 0"
            fill="none" stroke="#E3DAF6" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- acolhendo: a asa esquerda abraça a barriga (como quem põe a mão no coração) -->
    @if (exp() === 'acolhendo') {
      <path d="M40 116 C 30 150, 52 176, 104 168 C 86 160, 70 144, 64 120 Z" fill="#6A4DC0" />
    }

    <!-- asa direita -->
    @if (exp() === 'oi') {
      <g class="asa-aceno zona" (click)="tocar('asa', $event)">
        <ellipse cx="166" cy="104" rx="13" ry="34" transform="rotate(-38 166 104)" fill="#6A4DC0" />
      </g>
      <path class="tracos-aceno" d="M182 58 q8 4 6 12 M190 50 q10 6 8 16" fill="none" stroke="#9D8FE7" stroke-width="3" stroke-linecap="round" />
    } @else {
      <g class="asa-dir zona" (click)="tocar('asa', $event)">
        <ellipse cx="158" cy="146" rx="14" ry="36" transform="rotate(-12 158 146)" fill="#6A4DC0" />
      </g>
    }

    <!-- olhos -->
    <g class="zona" (click)="tocar('olhos', $event)">
      <!-- área invisível para facilitar o toque nos olhos -->
      <rect x="52" y="68" width="96" height="44" fill="transparent" />
      @switch (exp()) {
        @case ('acolhendo') {
          <path d="M60 98 q16 -16 32 0" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" />
          <path d="M108 98 q16 -16 32 0" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" />
        }
        @case ('risada') {
          <!-- olhinhos fechados de tanto rir: > < -->
          <path d="M62 84 L84 94 L62 104" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M138 84 L116 94 L138 104" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        }
        @case ('tonta') {
          <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="124" cy="92" r="21" fill="#FFFFFF" />
          <path class="espiral" d="M76 92 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 1 1 5 5 a9 9 0 1 1 -9 -9 a13 13 0 1 1 13 13"
                fill="none" stroke="#2A1B5C" stroke-width="3" stroke-linecap="round" />
          <path class="espiral" d="M124 92 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 1 1 5 5 a9 9 0 1 1 -9 -9 a13 13 0 1 1 13 13"
                fill="none" stroke="#2A1B5C" stroke-width="3" stroke-linecap="round" />
        }
        @case ('sonhando') {
          <!-- olhões brilhando, olhando a lua -->
          <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="124" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="72" cy="86" r="12" fill="#2A1B5C" />
          <circle cx="120" cy="86" r="12" fill="#2A1B5C" />
          <path d="M68 80 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" fill="#F7D774" />
          <path d="M116 80 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" fill="#F7D774" />
        }
        @case ('piscadinha') {
          <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="79" cy="95" r="11" fill="#2A1B5C" />
          <circle cx="83" cy="90" r="4" fill="#FFFFFF" />
          <path class="olho-piscando" d="M108 96 q16 -12 32 0" fill="none" stroke="#2A1B5C" stroke-width="5" stroke-linecap="round" />
        }
        @case ('pensando') {
          <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="124" cy="92" r="21" fill="#FFFFFF" />
          <circle cx="82" cy="86" r="11" fill="#2A1B5C" />
          <circle cx="130" cy="86" r="11" fill="#2A1B5C" />
          <circle cx="86" cy="82" r="4" fill="#FFFFFF" />
          <circle cx="134" cy="82" r="4" fill="#FFFFFF" />
        }
        @default {
          <g class="olhos">
            <circle cx="76" cy="92" r="21" fill="#FFFFFF" />
            <circle cx="124" cy="92" r="21" fill="#FFFFFF" />
            <circle cx="79" cy="95" r="11" fill="#2A1B5C" />
            <circle cx="121" cy="95" r="11" fill="#2A1B5C" />
            <circle cx="83" cy="90" r="4" fill="#FFFFFF" />
            <circle cx="125" cy="90" r="4" fill="#FFFFFF" />
          </g>
        }
      }
    </g>

    <!-- bochechas e bico -->
    <ellipse class="bochecha" cx="54" cy="116" rx="9" ry="6" fill="#F4A6C6" opacity=".9" />
    <ellipse class="bochecha" cx="146" cy="116" rx="9" ry="6" fill="#F4A6C6" opacity=".9" />
    <g class="zona" (click)="tocar('bico', $event)">
      @if (exp() === 'risada') {
        <!-- bico aberto de tanto rir -->
        <path d="M92 108 L108 108 L100 114 Z" fill="#F5A04A" stroke="#F5A04A" stroke-width="2" stroke-linejoin="round" />
        <path d="M94 116 L106 116 L100 124 Z" fill="#E68A35" stroke="#E68A35" stroke-width="2" stroke-linejoin="round" />
      } @else {
        <path d="M93 110 L107 110 L100 120 Z" fill="#F5A04A" stroke="#F5A04A" stroke-width="2" stroke-linejoin="round" />
      }
    </g>

    <!-- cachecol rosa -->
    <g class="zona" (click)="tocar('cachecol', $event)">
      <path d="M58 126 C 80 136, 120 136, 142 126 L 142 138 C 120 148, 80 148, 58 138 Z" fill="#F28BB3" />
      <path d="M70 132 v10 M84 135 v10 M98 136 v10 M112 135 v10 M126 132 v10" stroke="#F7B3CD" stroke-width="2.5" stroke-linecap="round" />
      <g class="ponta-cachecol">
        <path d="M120 140 L132 140 L136 170 L124 166 Z" fill="#E66F9C" />
        <path d="M110 140 L122 140 L116 162 L106 158 Z" fill="#F28BB3" />
      </g>
    </g>
  </g>

  <!-- extras de cada expressão -->
  @if (exp() === 'pensando' && !soRosto) {
    <g class="balao">
      <circle cx="160" cy="36" r="14" fill="#FFFFFF" stroke="#E3DAF6" stroke-width="2" />
      <text x="160" y="42" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="800" font-size="17" fill="#5B3D99">?</text>
    </g>
  }
  @if (exp() === 'acolhendo' && !soRosto) {
    <path class="coracao" d="M160 36 c-4 -8 -16 -6 -14 4 c1 6 8 10 14 14 c6 -4 13 -8 14 -14 c2 -10 -10 -12 -14 -4 z" fill="#F28BB3" />
  }
  <!-- easter egg "tontinha": estrelinhas girando em volta da cabeça -->
  @if (efeito() === 'tonta' && !soRosto) {
    <g class="orbita">
      <path d="M100 18 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#F7D774" />
      <path d="M150 34 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#F7D774" />
      <path d="M50 34 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#F7D774" />
    </g>
  }
  <!-- easter egg "abraço": coraçõezinhos subindo -->
  @if (efeito() === 'abraco' && !soRosto) {
    <g class="coracoes-abraco">
      <path class="c1" d="M60 70 c-3 -6 -12 -5 -11 3 c1 5 6 8 11 11 c5 -3 10 -6 11 -11 c1 -8 -8 -9 -11 -3 z" fill="#F28BB3" />
      <path class="c2" d="M140 60 c-3 -6 -12 -5 -11 3 c1 5 6 8 11 11 c5 -3 10 -6 11 -11 c1 -8 -8 -9 -11 -3 z" fill="#B79BF2" />
      <path class="c3" d="M100 40 c-3 -6 -12 -5 -11 3 c1 5 6 8 11 11 c5 -3 10 -6 11 -11 c1 -8 -8 -9 -11 -3 z" fill="#E66F9C" />
    </g>
  }
</svg>

<!-- balãozinho de fala dos easter eggs -->
@if (fala()) {
  <span class="fala" role="status">{{ fala() }}</span>
}
