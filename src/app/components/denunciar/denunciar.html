<button type="button" class="den-btn" [class.den-btn-icone]="!rotulo" (click)="abrir($event)" [attr.aria-label]="(rotulo || 'Denunciar') + ' ' + nomeTipo" [title]="rotulo || 'Denunciar'">
  <i class="fa-regular fa-flag"></i>
  @if (rotulo) { <span>{{ rotulo }}</span> }
</button>

<dialog #caixa class="den-caixa" aria-labelledby="den-titulo" (click)="aoClicarNoDialogo($event)" (cancel)="aoCancelar($event)">
  @if (aberto()) {
    <div class="den-conteudo">
      <button type="button" class="den-fechar" aria-label="Fechar" (click)="fechar()"><i class="fa-solid fa-xmark"></i></button>

      <span class="den-blob den-blob-1" aria-hidden="true"></span>
      <span class="den-blob den-blob-2" aria-hidden="true"></span>

      <div class="den-topo">
        <span class="den-acolhe" aria-hidden="true"><i class="fa-solid fa-shield-heart"></i></span>
        <h3 id="den-titulo">Algo te incomodou?</h3>
        <p class="den-sub">Conte pra gente o que aconteceu com este {{ nomeTipo }}. A sua identidade fica protegida e nossa equipe vai olhar com carinho.</p>
        @if (alvoTitulo) { <p class="den-alvo">“{{ alvoTitulo }}”</p> }
      </div>

      <label for="den-motivo">Motivo</label>
      <div class="den-select">
        <select id="den-motivo" [(ngModel)]="motivo" name="motivo" [class.vazio]="!motivo">
          <option value="" disabled>Selecione o motivo</option>
          @for (m of motivos; track m) { <option [value]="m">{{ m }}</option> }
        </select>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </div>

      <label for="den-detalhes">Quer contar mais? <small>(opcional)</small></label>
      <textarea id="den-detalhes" rows="3" maxlength="500" [(ngModel)]="detalhes" name="detalhes" placeholder="Explique o que aconteceu..."></textarea>
      <span class="den-contador">{{ detalhes.length }}/500</span>

      @if (erro()) { <p class="den-erro" role="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ erro() }}</p> }

      <div class="den-acoes">
        <button type="button" class="den-secundario" [disabled]="enviando()" (click)="fechar()">Cancelar</button>
        <button type="button" class="den-primario" [disabled]="enviando()" (click)="enviar()"><i class="fa-regular fa-paper-plane"></i> {{ enviando() ? 'Enviando...' : 'Enviar denúncia' }}</button>
      </div>
    </div>
  }
</dialog>
